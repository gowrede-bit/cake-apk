name: Android Build (Stub)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        required: true
        type: choice
        default: testing
        options:
          - testing
          - distribution

jobs:
  android-build-stub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Android stub build
        run: |
          mkdir -p artifacts
          STUB_LOG_PATH="artifacts/android-${{ github.event.inputs.mode }}-stub.log" npm run "build:android:${{ github.event.inputs.mode }}"

      - name: Upload Android stub log
        uses: actions/upload-artifact@v4
        with:
          name: android-build-stub-${{ github.event.inputs.mode }}
          path: artifacts/android-${{ github.event.inputs.mode }}-stub.log
          if-no-files-found: error
